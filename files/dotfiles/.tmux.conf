# Enable true color support
set -ga terminal-overrides ",*256col*:Tc"

# Make tmux more responsive to escape sequences
set -s escape-time 0

# Change prefix from Ctrl+B to Ctrl+A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane navigation with no prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting without prefix
bind -n C-y split-window -h  # Horizontal split (side by side)
bind -n C-x split-window -v  # Vertical split (top/bottom)

# Pane splitting with prefix (Ctrl+A y and Ctrl+A x)
unbind x
bind x split-window -v       # Ctrl+A x → vertical split
unbind y
bind y split-window -h       # Ctrl+A y → horizontal split

# Set window and pane indices to start from 1
set -g base-index 1
setw -g pane-base-index 1

# Auto-renumber windows after closing one
set-option -g renumber-windows on

# ---------------------------------------------------------------- status bar --
# Colours come from ~/.config/theme/tmux-colors.conf, generated by
# modules/theme/gruvbox.nix out of palette.nix -- no hex is written here.
# tmux expands #{@user_option} inside style strings, so the @tm_* names below
# resolve at draw time.
source-file -q ~/.config/theme/tmux-colors.conf

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#{@tm_bg},fg=#{@tm_fg_dim}"

# Left: session name. Nothing else -- the window list carries the rest.
set -g status-left-length 30
set -g status-left " #[fg=#{@tm_accent},bold]#S#[default]   "

# Windows. Minimal on purpose: no separators, colour alone marks the active
# one. #F is the flag (* current, - last, Z zoomed).
set -g window-status-format "#[fg=#{@tm_fg_faint}]#I #W "
set -g window-status-current-format "#[fg=#{@tm_accent},bold]#I #W#{?window_zoomed_flag,  ,} "
set -g window-status-separator " "
set -g window-status-bell-style "fg=#{@tm_urgent},bold"

# Right: prefix indicator, then clock. The indicator only draws while tmux is
# waiting for the key after C-a, which is the moment it is useful.
set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=#{@tm_warn}\,bold]  ,}#[fg=#{@tm_fg_faint}]%H:%M  %a %d %b "

# Panes: quiet borders, active one only slightly brighter (see palette.nix --
# borders deliberately are not the accent).
set -g pane-border-style "fg=#{@tm_border}"
set -g pane-active-border-style "fg=#{@tm_border_on}"

# Messages and the command prompt.
set -g message-style "bg=#{@tm_bg_alt},fg=#{@tm_fg}"
set -g mode-style "bg=#{@tm_bg_alt},fg=#{@tm_fg}"

# Enable mouse support
set -g mouse on

# Increase scrollback history
set-option -g history-limit 250000

