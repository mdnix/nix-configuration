#? Config file for btop v. 1.4.7

# Only the keys that differ from btop's defaults live here; btop fills in the
# rest on its own.
#
# A path, not a name: btop rewrites this file on exit and resolves a bare name
# to a /nix/store path that goes stale on the next upgrade and churns the repo.
# current.theme is a stable symlink theme-toggle flips.
color_theme = "/home/marco/.config/btop/themes/current.theme"

# Carried over from the config btop had written before this file took over.
proc_sorting = "pid"
proc_reversed = true
proc_tree = true
