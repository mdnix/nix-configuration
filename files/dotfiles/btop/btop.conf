#? Config file for btop v. 1.4.7

# Only the keys that differ from btop's defaults live here; btop fills in the
# rest on its own. The theme ships inside the btop package and its values are
# already identical to modules/theme/palette.nix (main_bg #282828, main_fg
# #d4be98, hi_fg #ea6962), so there is no second copy of the palette to drift.
color_theme = "gruvbox_material_dark"

# Carried over from the config btop had written before this file took over.
proc_sorting = "pid"
proc_reversed = true
proc_tree = true
