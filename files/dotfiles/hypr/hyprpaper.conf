# The dark default only. hyprpaper has no variables, so every other wallpaper
# is set over IPC by `theme-toggle apply`.
preload = /home/marco/.config/wallpapers/gruvbox-backwater.jpg

wallpaper {
    monitor =
    path = /home/marco/.config/wallpapers/gruvbox-backwater.jpg
    fit_mode = cover
}

ipc = on
splash = false
splash_offset = 2
